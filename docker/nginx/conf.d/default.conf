server {
    listen 80;
    server_name mycloud.cysmk.online;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        # Uncomment this to redirect HTTP to HTTPS once you have the certificate
        # return 301 https://$host$request_uri;
        
        # Until HTTPS is setup, we serve HTTP directly:
        proxy_pass http://mycloud-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://mycloud-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 500M;
    }
}

