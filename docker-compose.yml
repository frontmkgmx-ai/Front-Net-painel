version: '3.8'

services:
  reverse-proxy:
    image: nginx:alpine
    container_name: mycloud-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl
      - certbot-webroot:/var/www/certbot
    networks:
      - public_net
      - private_net
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mycloud-frontend
    restart: unless-stopped
    networks:
      - private_net
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mycloud-backend
    restart: unless-stopped
    networks:
      - private_net
    secrets:
      - mysql_password
      - mongodb_password
      - redis_password
      - jwt_secret
      - session_secret
      - admin_initial_password
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=mycloud
      - MYSQL_USER=mycloud
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DATABASE=mycloud
      - MONGODB_USER=mycloud
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ADMIN_INITIAL_USERNAME=admin
      - STORAGE_PATH=/opt/mycloud/storage
    volumes:
      - /opt/mycloud/storage:/opt/mycloud/storage
      - /etc/mycloud/config:/etc/mycloud/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    container_name: mycloud-mysql
    restart: unless-stopped
    networks:
      - private_net
    secrets:
      - mysql_root_password
      - mysql_password
    environment:
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_DATABASE=mycloud
      - MYSQL_USER=mycloud
    volumes:
      - /opt/mycloud/data/mysql:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$(cat /run/secrets/mysql_root_password)"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:6.0
    container_name: mycloud-mongodb
    restart: unless-stopped
    networks:
      - private_net
    secrets:
      - mongodb_password
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mycloud
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongodb_password
      - MONGO_INITDB_DATABASE=mycloud
    volumes:
      - /opt/mycloud/data/mongodb:/data/db
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mycloud-redis
    restart: unless-stopped
    networks:
      - private_net
    secrets:
      - redis_password
    command: >
      sh -c 'exec redis-server --requirepass "$$(cat /run/secrets/redis_password)"'
    volumes:
      - /opt/mycloud/data/redis:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  certbot:
    image: certbot/certbot
    container_name: mycloud-certbot
    volumes:
      - ./docker/nginx/ssl:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true

volumes:
  certbot-webroot:

secrets:
  mysql_root_password:
    file: /etc/mycloud/secrets/mysql_root_password
  mysql_password:
    file: /etc/mycloud/secrets/mysql_password
  mongodb_password:
    file: /etc/mycloud/secrets/mongodb_password
  redis_password:
    file: /etc/mycloud/secrets/redis_password
  jwt_secret:
    file: /etc/mycloud/secrets/jwt_secret
  session_secret:
    file: /etc/mycloud/secrets/session_secret
  admin_initial_password:
    file: /etc/mycloud/secrets/admin_initial_password
